name: Bug Report
description: submit a bug report for installing or upgrading hauler with homebrew
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        thank you for helping us improve hauler... please fill out each section so we can better assist you. bugs in the `hauler` cli itself belong in [hauler-dev/hauler](https://github.com/hauler-dev/hauler/issues). the casks here are generated by goreleaser, so fixes usually land in that repo.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before Submitting
      options:
        - label: I searched the existing issues and this bug has not been reported
          required: true

  - type: dropdown
    id: cask
    attributes:
      label: Cask
      description: which cask were you installing or upgrading?
      options:
        - hauler
        - hauler-dev
        - hauler@<version>
    validations:
      required: true

  - type: input
    id: cask-version
    attributes:
      label: Cask Version
      description: provide the version from `brew info --cask <cask>` or the exact `hauler@<version>` used
      placeholder: 2.1.2
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environmental Info
      description: provide the output of `brew config` (includes os, arch, and homebrew version)
      render: text
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: provide a clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: provide the exact brew commands needed to reproduce the bug
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: provide a clear and concise description of what you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: provide a clear and concise description of what actually happens
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: provide the output of the failing command re-run with `--verbose` (i.e. `brew install --cask --verbose hauler`)
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: provide any other context about the bug (i.e. other hauler casks installed, custom install prefix)
    validations:
      required: false
